<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undangan Pernikahan — Bernaung</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ee;color:#18231f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{text-align:center;padding:32px}.mark{font-size:12px;letter-spacing:.22em;font-weight:700}.text{margin-top:14px;color:#66716c;font-size:14px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script></head><body><div class="box"><div class="mark">BERNAUNG</div><div class="text" id="routerText">Menyiapkan undangan…</div></div><script>(async function(){const params=new URLSearchParams(location.search),parts=location.pathname.split('/').filter(Boolean),slug=params.get('slug')||((parts.length===1&&parts[0]!=='undangan.html')?decodeURIComponent(parts[0]):'');const guest=params.get('to')||'',text=document.getElementById('routerText');if(!slug){text.textContent='Undangan tidak ditemukan.';return}if(!supabaseReady()){text.textContent='Supabase belum dikonfigurasi.';return}const {data,error}=await supabaseClient.rpc('get_public_invitation',{p_slug:slug});if(error||!data){console.error(error);text.textContent='Undangan tidak ditemukan atau belum aktif.';return}const template=data.templateUrl||'templates/adat-nusantara.html',url=new URL(template,location.origin);url.searchParams.set('slug',slug);if(guest)url.searchParams.set('to',guest);location.replace(url.pathname+url.search)})();</script></body></html>
