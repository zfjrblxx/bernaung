<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran — Bernaung</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script></head><body class="payment-page"><header class="site-header"><div class="container nav"><a class="brand" href="/">BERNAUNG</a><span class="progress-label">05 / 05 · CHECKOUT</span></div></header><main class="wizard-page"><div class="container narrow"><div class="wizard-top"><span class="eyebrow">CHECKOUT</span><h1>Selesaikan pembayaran.</h1><p>Harga final untuk satu undangan mengikuti harga terbaru Bernaung.</p><div class="progress"><span style="width:90%"></span></div></div><div class="payment-card"><span class="eyebrow">TOTAL</span><div class="amount" data-price></div><div id="adminPaymentMethods" class="admin-payment-methods"></div><div id="adminQris" class="admin-qris hidden"></div><div class="notice">Transfer sesuai nominal. Setelah itu upload bukti pembayaran di bawah.</div></div><form id="paymentForm" class="form-card payment-form-card"><div class="form-section"><h2>Bukti pembayaran</h2><label>Nama (Harus sesuai dengan nama rekening)<input name="buyer" placeholder="Nama lengkap" required></label><label>Metode<select name="method"><option>BCA</option><option>DANA</option><option>Bank / e-wallet lain</option></select></label><label>Nominal<input name="amount" type="number" value="" data-price-input required></label><label>File bukti<input name="proof" type="file" accept="image/*,.pdf" required></label><label>Catatan<textarea name="note" rows="3" placeholder="Opsional"></textarea></label></div><div class="sticky-actions"><a class="btn btn-light" href="/recheck">Kembali</a><button class="btn btn-dark" type="submit">Kirim pembayaran →</button></div></form></div></main><script src="js/app.js"></script><script src="js/payment.js"></script></body></htm
